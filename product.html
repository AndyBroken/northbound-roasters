<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee — Northbound Coffee Roasters</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2323453a'/><path d='M5 25 13 12l4 6 3-4 7 11z' fill='%23f7f4ee'/></svg>">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="coffee">
<div id="header"></div>

<main class="container">
  <div class="crumbs" style="margin-top:32px"><a href="index.html">Home</a> / <a href="coffee.html">Our Coffee</a> / <span id="crumb"></span></div>
  <div class="product" id="product"></div>

  <section style="padding-top:0">
    <div class="section-head"><div><span class="eyebrow">You might also like</span><h2>More from the roastery</h2></div><a href="coffee.html" class="link-arrow">All coffee →</a></div>
    <div class="grid-3" id="related"></div>
  </section>
</main>

<div id="footer"></div>
<script src="assets/data.js"></script>
<script src="assets/main.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
const c = COFFEES.find(x => x.id === id) || COFFEES[0];
document.title = `${c.name} — Northbound Coffee Roasters`;
document.getElementById('crumb').textContent = c.name;
const shots = ['bag', '1773118360501-00f979fd9322', '1522012188892-24beb302783d', '1537130508299-46ab547b4be3'];
const view = s => s === 'bag' ? bagSVG(c) : `<img src="${IMG(s, 1100)}" alt="${c.name}">`;
document.getElementById('product').innerHTML = `
  <div>
    <div class="gallery-main" id="mainImg">${view('bag')}</div>
    <div class="thumbs">${shots.map((s, i) => `<button class="${i ? '' : 'active'}" data-src="${s}" aria-label="View image ${i + 1}">${s === 'bag' ? bagSVG(c) : `<img src="${IMG(s, 240)}" alt="">`}</button>`).join('')}</div>
  </div>
  <div>
    <span class="eyebrow">${c.roast} Roast · ${c.origin}</span>
    <h1>${c.name}</h1>
    <div style="display:flex;gap:1rem;align-items:center;margin-bottom:1rem"><span class="stars">★★★★★</span><span style="color:var(--muted);font-size:.92rem">4.9 · 312 reviews</span></div>
    <p class="lead">${c.desc}</p>
    <div class="notes">${c.notes.map(n => `<span>${n}</span>`).join('')}</div>
    <div class="specs">
      <div><small>Origin</small>${c.origin}</div>
      <div><small>Process</small>${c.process}</div>
      <div><small>Altitude</small>${c.altitude}</div>
      <div><small>Roast</small>${roastMeter(c.roast)}</div>
    </div>
    <div style="display:flex;align-items:baseline;gap:.6rem;margin-bottom:1.2rem"><span style="font-family:var(--serif);font-size:2.2rem">$${c.price}</span><span style="color:var(--muted)">/ ${c.size} bag · whole bean or ground</span></div>
    <div style="display:flex;gap:.8rem;flex-wrap:wrap">
      <a href="contact.html" class="btn btn-primary">Order by Phone or Email</a>
      <a href="contact.html#wholesale" class="btn btn-outline">Wholesale Pricing</a>
    </div>
    <div class="where">
      <h4>Find it in stores</h4>
      <ul><li>Northbound Café — SE Division St, Portland</li><li>Greenleaf Market (all Portland locations)</li><li>Cascade Co-op — Eugene &amp; Bend</li><li>Harbor Street Grocers — Seattle</li></ul>
    </div>
  </div>`;
document.querySelectorAll('.thumbs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.thumbs button').forEach(x => x.classList.toggle('active', x === b));
  document.getElementById('mainImg').innerHTML = view(b.dataset.src);
}));
document.getElementById('related').innerHTML = COFFEES.filter(x => x.id !== c.id).slice(0, 3).map(coffeeCard).join('');
observeReveals();
</script>
</body>
</html>
